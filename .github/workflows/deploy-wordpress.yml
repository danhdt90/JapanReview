name: Deploy WordPress (Git-based releases)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Kiểm tra PHP syntax cơ bản
      - name: Validate PHP files
        run: find . -type f -name "*.php" -exec php -l {} \;

      # 3️⃣ Deploy qua SSH
      - name: Deploy via SSH (git-based releases)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR=/home/ec2-user/wordspace/apache-mariadb/src/brandwoods-local
            REPO_URL=git@github.com:danhdt90/brandwoods-2025.git
            BRANCH=develop
            TS=$(date +%Y%m%d_%H%M%S)
            RELEASE_PATH=$APP_DIR/releases/$TS

            echo "==> Tạo thư mục release mới..."
            mkdir -p $RELEASE_PATH
            cd $RELEASE_PATH
            sudo chown -R "$USER":"$USER" "$APP_DIR"
            chmod -R a+rX "$APP_DIR"
            
            echo "==> Clone code..."
            git clone --depth=1 --branch $BRANCH $REPO_URL .

            echo "==> Dọn rác..."
            rm -rf .git .github tests
            cd "$APP_DIR"
            echo "==> Symlink shared file..."
            ln -sfn "shared/wp-config.php" wp-config.php
            ln -sfn "shared/uploads" wp-content/uploads

            echo "==> Cập nhật symlink current..."
            if [ -d "$APP_DIR/current" ] && [ ! -L "$APP_DIR/current" ]; then rm -rf "$APP_DIR/current"; fi
            
            ln -sfn "releases/$TS" current

            # echo "==> Reload Nginx..."
            # sudo systemctl reload nginx

            echo "✅ Deploy thành công! Bản mới: $TS"
